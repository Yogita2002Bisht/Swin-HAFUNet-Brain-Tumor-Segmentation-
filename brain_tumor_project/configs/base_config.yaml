# =============================================================================
# Swin-HAFUNet Brain Tumor Segmentation — Base Configuration
# =============================================================================
# Run: python main.py --config configs/base_config.yaml

# ── Project ──────────────────────────────────────────────────────────────────
project:
  name: "swin_hafunet_brisc"
  seed: 42

# ── Dataset ──────────────────────────────────────────────────────────────────
data:
  dataset: "brisc"                       # "brisc" or "brats" (future)
  brisc:
    root_dir: "d:/tumor/brisc2025/segmentation_task"
    train_images: "train/images"
    train_masks:  "train/masks"
    test_images:  "test/images"
    test_masks:   "test/masks"
    image_ext: ".jpg"
    mask_ext:  ".png"
  brats:
    root_dir: "d:/tumor/BraTS2021_Training_Data"
    modalities: ["t1", "t1ce", "t2", "flair"]
  val_split: 0.15                        # fraction of training set used for validation
  num_workers: 0                         # 0 avoids Windows shared-memory errors
  pin_memory: true

# ── Transforms / Augmentation ────────────────────────────────────────────────
transforms:
  image_size: 224                        # resize to (224, 224)
  mean: [0.485, 0.456, 0.406]           # ImageNet statistics
  std:  [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: true
    vertical_flip: false
    random_rotation: 15                  # degrees
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.1
      hue: 0.05

# ── Model ────────────────────────────────────────────────────────────────────
model:
  name: "swin_hafunet"
  encoder:
    backbone: "swin_tiny_patch4_window7_224"   # timm model name
    pretrained: true
    in_channels: 3
    feature_channels: [96, 192, 384, 768]      # Swin-Tiny feature dims
  decoder:
    channels: [256, 128, 64, 32]
    attention_type: "hierarchical"              # HAF attention
    dropout: 0.1
  num_classes: 1                               # binary segmentation

# ── Loss ─────────────────────────────────────────────────────────────────────
loss:
  name: "combined"                             # "dice", "bce", or "combined"
  dice_weight: 0.5
  bce_weight: 0.5
  smooth: 1.0                                 # Dice smoothing factor

# ── Optimizer ────────────────────────────────────────────────────────────────
optimizer:
  name: "adamw"
  lr: 1.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

# ── Scheduler ────────────────────────────────────────────────────────────────
scheduler:
  name: "cosine"                               # cosine annealing
  T_max: 150
  eta_min: 1.0e-6

# ── Training ─────────────────────────────────────────────────────────────────
training:
  epochs: 150
  batch_size: 8
  mixed_precision: true                        # torch.cuda.amp
  gradient_clip_max_norm: 1.0
  early_stopping:
    patience: 20
    min_delta: 0.001
    monitor: "val_dice"                        # metric to watch
  accumulation_steps: 1                        # gradient accumulation

# ── Evaluation ───────────────────────────────────────────────────────────────
evaluation:
  metrics: ["dice", "iou", "precision", "recall"]
  threshold: 0.5                               # binarisation threshold

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  log_dir: "logs"
  results_dir: "results"                       # CSV tables, charts, timing, summary
  log_every_n_steps: 10
  save_val_predictions: true                   # save sample predictions each epoch
  tensorboard: true

# ── Checkpoints ──────────────────────────────────────────────────────────────
checkpoint:
  dir: "checkpoints"
  save_best: true
  save_last: true
  monitor: "val_dice"
  mode: "max"                                  # "max" for dice, "min" for loss
